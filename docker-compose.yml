services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    ports:
      - "5433:5432"  # host 5433 avoids clashing with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # inside docker: service name "db", container port 5432 (never localhost)
      DATABASE_URL: postgresql://registry:registry@db:5432/registry
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000  # the browser runs on the host
      INTERNAL_API_URL: http://api:8000  # server-side fetches run inside the container, where localhost is not the API
    depends_on:
      - api

volumes:
  pgdata:
